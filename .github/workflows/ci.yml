name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (shellcheck / cppcheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HIS_System_Project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck tests/*.sh

      - name: cppcheck
        run: |
          sudo apt-get update >/dev/null && sudo apt-get install -y cppcheck >/dev/null
          cppcheck --std=c99 --enable=warning,performance,portability \
            --suppress=missingIncludeSystem --error-exitcode=1 *.c *.h

  build-and-test:
    name: Build & Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (make)
        working-directory: HIS_System_Project
        run: make

      - name: Check zero warnings (GCC/Clang)
        if: runner.os != 'Windows'
        working-directory: HIS_System_Project
        run: |
          make clean >/dev/null 2>&1 || true
          out=$(make 2>&1 | grep -c "warning:" || true)
          echo "warning count = $out"
          if [ "$out" -ne 0 ]; then
            echo "::error::编译告警未清零（$out 条）"
            exit 1
          fi

      - name: Run full-flow regression tests
        working-directory: HIS_System_Project
        run: bash tests/full_flow_test.sh

  build-msvc:
    name: Build (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild HIS_System_Project/HIS_System_Project.sln /p:Configuration=Release /p:Platform=x64 /m "/flp:LogFile=msbuild-warn.log;Verbosity=Normal"

      - name: Check zero warnings (MSVC)
        shell: bash
        run: |
          out=$(grep -cE "warning C[0-9]+" msbuild-warn.log || true)
          echo "warning count = $out"
          if [ "$out" -ne 0 ]; then
            grep -E "warning C[0-9]+" msbuild-warn.log | sort -u | head -20
            echo "::error::MSVC 编译告警未清零（$out 条）"
            exit 1
          fi
